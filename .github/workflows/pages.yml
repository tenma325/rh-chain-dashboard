# Direct Upload on purpose: Git Provider stays No.
# Connecting Cloudflare Pages Git is irreversible, would dual-deploy
# against this wrangler-action, and recreating the project would drop
# trade.ferrisgg.vip plus Pages Functions secrets.
# https://developers.cloudflare.com/pages/how-to/use-direct-upload-with-continuous-integration/
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ferris-trade-dashboard
