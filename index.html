<style>
:root {
  --bg: #0a0e17;
  --surface: #111827;
  --border: #1e293b;
  --text: #e2e8f0;
  --muted: #64748b;
  --green: #22c55e;
  --red: #ef4444;
  --accent: #38bdf8;
  --gold: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
  font-size: 14px;
  padding: 20px 24px 40px;
}
h1 { font-size: 20px; font-weight: 650; letter-spacing: 0.02em; }
h2 {
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 12px;
  font-weight: 600;
}
.header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.addr { font-family: ui-monospace, "Cascadia Code", monospace; color: var(--accent); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
.dot.ok { background: var(--green); }
.dot.err { background: var(--red); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; }
.kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.kpi .value { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi .sub { color: var(--muted); font-size: 11px; margin-top: 4px; }
.win { color: var(--green); }
.loss { color: var(--red); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin-bottom: 16px; }
.chart-wrap { height: 240px; position: relative; }
.two { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
@media (max-width: 960px) { .two { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left;
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 8px 8px 8px 0;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
}
td {
  padding: 8px 8px 8px 0;
  border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
}
.sym { color: var(--accent); font-weight: 650; font-family: ui-monospace, monospace; }
.num { text-align: right; }
.tag { color: var(--gold); font-size: 12px; }
.scroll { overflow-x: auto; }
.footer { color: var(--muted); font-size: 11px; text-align: center; margin-top: 8px; }
.dot.loading { background: var(--gold); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
.banner {
  background: #3f1d20;
  border: 1px solid var(--red);
  color: #fecaca;
  border-radius: 6px;
  padding: 10px 14px;
  margin-bottom: 16px;
  font-size: 13px;
}
.banner.warn {
  background: #3a2e15;
  border-color: var(--gold);
  color: #fde68a;
}
.banner[hidden] { display: none; }
</style>
</head>

const tick = { color: "#64748b", font: { size: 10 } };
const RH_RPC = "https://rpc.mainnet.chain.robinhood.com";
const WETH = "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73";
const grid = { color: "#1e293b" };
const charts = {};
let hasRendered = false;
let snapshotDegraded = false;
let rpcFailed = false;
let sourceLabel = "読み込み中…";

function chartOptions() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: tick, grid },
      y: { ticks: { ...tick, callback: v => Number(v).toFixed(5) }, grid },
    },
  };
}

function el(tag, attrs) {
  const node = document.createElement(tag);
  if (!attrs) return node;
  if (attrs.className) node.className = attrs.className;
  if (attrs.text != null) node.textContent = String(attrs.text);
  if (attrs.colSpan) node.colSpan = attrs.colSpan;
  return node;
}

function setSource(text) {
  sourceLabel = text;
  const extra = rpcFailed ? " · RPC失敗" : "";
  document.getElementById("source").textContent = text + extra;
}

function showBanner(text, kind) {
  const banner = document.getElementById("statusBanner");
  banner.hidden = false;
  banner.className = "banner" + (kind === "warn" ? " warn" : "");
  banner.textContent = text;
}

function updateBanner() {
  const parts = [];
  if (snapshotDegraded) parts.push("スナップショットの取得に失敗したため、埋め込みデータを表示しています。");
  if (rpcFailed) parts.push("オンチェーン残高の更新に失敗しました。");
  if (!parts.length) {
    const banner = document.getElementById("statusBanner");
    banner.hidden = true;
    banner.textContent = "";
    return;
  }
  showBanner(parts.join(" "), snapshotDegraded ? "err" : "warn");
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function withRetry(fn, attempts, baseMs, capMs) {
  const maxAttempts = attempts == null ? 3 : attempts;
  const base = baseMs == null ? 400 : baseMs;
  const cap = capMs == null ? 4000 : capMs;
  let lastErr;
  for (let i = 0; i < maxAttempts; i++) {
    try {
      return await fn();
    } catch (err) {
      lastErr = err;
      console.warn("request failed", i + 1, "/", maxAttempts, err);
      if (err && err.noRetry) break;
      if (i === maxAttempts - 1) break;
      await sleep(Math.min(cap, base * (2 ** i)));
    }
  }
  throw lastErr;
}

function cls(n) { return n >= 0 ? "win" : "loss"; }
function fmt(n, d=6) {
  const x = Number(n || 0);
  return (x >= 0 ? "+" : "") + x.toFixed(d);
}
function shortAddr(a) {
  if (!a) return "ウォレット未接続";
  return a.slice(0, 8) + "…" + a.slice(-6);
}
function when(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso.slice(0, 16).replace("T", " ");
  return d.toLocaleString("ja-JP", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function kpis(s) {
  const w = s.wallet;
  const st = s.stats;
  const items = [
    ["残高", w.total_eth.toFixed(6), `ETH ${w.eth.toFixed(6)} + WETH ${w.weth.toFixed(6)}`, ""],
    ["当日実現", fmt(st.daily_pnl_eth), `本日エントリー ${st.trades_today} 件`, cls(st.daily_pnl_eth)],
    ["累積実現", fmt(st.total_realized_eth), `決済 ${st.closed_trades} 件`, cls(st.total_realized_eth)],
    ["勝率", st.win_rate.toFixed(1) + "%", `${st.wins}勝 / ${st.losses}敗`, ""],
    ["建玉", String(st.open_positions), `ライブリスク ${st.live_risk}`, ""],
    ["ルート", st.sell_route_healthy ? "正常" : "注意", `連敗 ${st.consecutive_losses}`, st.sell_route_healthy ? "win" : "loss"],
  ];
  const root = document.getElementById("kpis");
  root.replaceChildren(...items.map(([label, value, sub, c]) => {
    const kpi = el("div", { className: "kpi" });
    kpi.append(
      el("div", { className: "label", text: label }),
      el("div", { className: c ? "value " + c : "value", text: value }),
      el("div", { className: "sub", text: sub }),
    );
    return kpi;
  }));
}

function lineChart(id, labels, data, color) {
  const ctx = document.getElementById(id);
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data,
        borderColor: color,
        backgroundColor: "rgba(56,189,248,0.08)",
        fill: true,
        tension: 0.25,
        pointRadius: labels.length > 40 ? 0 : 3,
        borderWidth: 2,
      }],
    },
    options: chartOptions(),
  });
}

function barChart(id, labels, data) {
  const ctx = document.getElementById(id);
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: data.map(v => v >= 0 ? "#22c55e" : "#ef4444"),
      }],
    },
    options: chartOptions(),
  });
}

function render(s) {
  document.getElementById("dot").className = "dot " + (s.wallet.ok ? "ok" : "err");
  document.getElementById("generated").textContent = s.generated_at;
  document.getElementById("address").textContent = shortAddr(s.wallet.address);
  kpis(s);

  const hist = s.wallet_history || [];
  if (hist.length) {
    lineChart("walletChart", hist.map(p => p.label), hist.map(p => p.total_eth), "#38bdf8");
  }
  const curve = s.equity_curve || [];
  if (curve.length) {
    const last = curve[curve.length - 1].cum_eth;
    lineChart("equityChart", curve.map(p => p.symbol), curve.map(p => p.cum_eth), last >= 0 ? "#22c55e" : "#ef4444");
  }
  const daily = s.daily_pnl || [];
  if (daily.length) {
    barChart("dailyChart", daily.map(p => p.day.slice(5)), daily.map(p => p.pnl_eth));
  }

  const posBody = document.getElementById("positions");
  const positions = s.positions || [];
  if (!positions.length) {
    const empty = el("tr");
    empty.appendChild(el("td", { text: "建玉なし", colSpan: 6 }));
    posBody.replaceChildren(empty);
  } else {
    posBody.replaceChildren(...positions.map(p => {
      const tr = el("tr");
      const symbol = p.symbol || (p.address ? p.address.slice(0, 10) : "—");
      tr.append(
        el("td", { className: "sym", text: symbol }),
        el("td", { text: p.live_risk ? "ライブ" : "同期" }),
        el("td", { className: "num", text: Number(p.eth_spent || 0).toFixed(6) }),
        el("td", { className: "num", text: Number(p.remaining_pct || 0).toFixed(0) + "%" }),
        el("td", { className: "num", text: Number(p.onchain_balance || 0).toFixed(4) }),
        el("td", { text: when(p.entry_time) }),
      );
      return tr;
    }));
  }

  const tradeBody = document.getElementById("trades");
  const trades = (s.recent_trades || []).slice(0, 16);
  if (!trades.length) {
    const empty = el("tr");
    empty.appendChild(el("td", { text: "取引なし", colSpan: 5 }));
    tradeBody.replaceChildren(empty);
  } else {
    tradeBody.replaceChildren(...trades.map(t => {
      const tr = el("tr");
      tr.append(
        el("td", { className: "sym", text: t.symbol || "—" }),
        el("td", { text: t.open ? "建中" : (t.is_win ? "勝" : "負") }),
        el("td", { className: t.open ? "num" : "num " + cls(t.pnl_eth), text: t.open ? "—" : fmt(t.pnl_eth) }),
        el("td", { className: t.open ? "num" : "num " + cls(t.pnl_pct), text: t.open ? "—" : fmt(t.pnl_pct, 2) }),
        el("td", { className: "tag", text: t.exit_reason || (t.open ? "open" : "") }),
      );
      return tr;
    }));
  }
}

function hexToEth(hex) {
  if (!hex) return 0;
  return Number(BigInt(hex)) / 1e18;
}

async function rpc(method, params) {
  return withRetry(async () => {
    const res = await fetch(RH_RPC, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }),
    });
    if (!res.ok) throw new Error("rpc " + res.status);
    const body = await res.json();
    if (body.error) throw new Error(body.error.message || "rpc");
    return body.result;
  });
}

async function refreshOnchain(s) {
  const addr = s.wallet && s.wallet.address;
  if (!addr) return s;
  const padded = addr.replace(/^0x/, "").toLowerCase().padStart(64, "0");
  const [ethHex, wethHex] = await Promise.all([
    rpc("eth_getBalance", [addr, "latest"]),
    rpc("eth_call", [{ to: WETH, data: "0x70a08231" + padded }, "latest"]),
  ]);
  const eth = hexToEth(ethHex);
  const weth = hexToEth(wethHex);
  s.wallet.eth = eth;
  s.wallet.weth = weth;
  s.wallet.total_eth = eth + weth;
  s.wallet.ok = true;
  return s;
}

async function fetchJson(url) {
  return withRetry(async () => {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) {
      const err = new Error("snapshot " + res.status + " " + url);
      if (res.status >= 400 && res.status < 500 && res.status !== 429) err.noRetry = true;
      throw err;
    }
    return res.json();
  });
}

async function fetchSnapshot() {
  const candidates = ["/api/snapshot", "./snapshot.json"];
  const errors = [];
  for (const url of candidates) {
    try {
      const data = await fetchJson(url);
      snapshotDegraded = false;
      setSource(url === "/api/snapshot" ? "ローカル 15秒更新" : "GitHub Pages");
      return data;
    } catch (err) {
      console.warn("snapshot candidate failed", url, err);
      errors.push((err && err.message) || String(err));
    }
  }
  if (window.__EMBEDDED_SNAPSHOT__) {
    snapshotDegraded = true;
    console.warn("using embedded snapshot after fetch failures", errors);
    setSource("埋め込み（取得失敗）");
    return JSON.parse(JSON.stringify(window.__EMBEDDED_SNAPSHOT__));
  }
  throw new Error("snapshot unavailable: " + errors.join("; "));
}

function setFetchError(message) {
  document.getElementById("dot").className = "dot err";
  document.getElementById("generated").textContent = "取得失敗: " + message;
  setSource("取得失敗");
  showBanner("スナップショットを取得できません: " + message, "err");
}

async function refresh() {
  if (!hasRendered) {
    document.getElementById("dot").className = "dot loading";
    document.getElementById("source").textContent = "読み込み中…";
    document.getElementById("generated").textContent = "スナップショット取得中…";
  }
  let s;
  try {
    s = await fetchSnapshot();
    hasRendered = true;
    render(s);
    updateBanner();
  } catch (err) {
    console.warn("snapshot refresh failed", err);
    setFetchError(err && err.message ? err.message : String(err));
    return;
  }
  try {
    render(await refreshOnchain(s));
    rpcFailed = false;
    setSource(sourceLabel);
    updateBanner();
  } catch (err) {
    console.warn("on-chain refresh failed", err);
    rpcFailed = true;
    if (s && s.wallet) s.wallet.ok = false;
    render(s);
    setSource(sourceLabel);
    updateBanner();
  }
}

refresh().catch(err => {
  console.warn("initial refresh failed", err);
});
setInterval(() => {
  refresh().catch(err => {
    console.warn("scheduled refresh failed", err);
  });
}, 15000);
</script>
